<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 474" width="100%" role="img" aria-label="Three-panel comparison of fire severity. LOW severity: surface fire; most trees survive; litter partly burned; soil intact. MODERATE severity: a mix of effects; some trees killed; understory burned. HIGH severity: crown fire; most of the canopy killed; soil organic layer burned off; erosion risk. Severity = how much the fire changed the ecosystem (plants and soil). Intensity = how much heat or energy the fire released. Big Basin 2020: about 77% high, 20% moderate, 2% low severity." font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" role="img" aria-label="Two graphs of population versus time. Left, Exponential (J-curve): with unlimited resources and no carrying capacity, the population curve starts slowly then rises faster and faster. Right, Logistic (S-curve): the population rises quickly, then slows and levels off at a dashed line labeled carrying capacity K." font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Exponential (J-curve) versus logistic (S-curve) population growth</title>
<defs><marker id="jcurve-scurve-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="jcurve-scurve-carrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3182ce"/></marker></defs>

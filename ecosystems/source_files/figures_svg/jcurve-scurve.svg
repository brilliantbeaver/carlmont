<text x="149" y="165" font-size="13" text-anchor="middle" font-style="italic" fill="#6b7280">keeps rising</text>
<text x="149" y="182" font-size="13" text-anchor="middle" font-style="italic" fill="#6b7280">faster and faster</text>
<text x="551" y="30" font-size="16" text-anchor="middle" font-weight="700" fill="#1f2937">Logistic (S-curve)</text>
<text x="551" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Limited resources — levels off at K</text>

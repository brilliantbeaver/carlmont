<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="100%" role="img" aria-label="Line graph of rabbit population (0 to 80) versus time in years (0 to 8) from the bean simulation. Values: year 0: 25, year 1: 33, year 2: 44, year 3: 64, year 4: 47, year 5: 73, year 6: 55, year 7: 50, year 8: 54. A dashed line at about 52 rabbits with a light band from 47 to 55 marks the estimated carrying capacity of about 50 to 55 rabbits." font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">

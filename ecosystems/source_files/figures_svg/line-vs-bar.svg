<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 426" width="100%" role="img" aria-label="Two mini graphs. Left: LINE graph, use for change over time or continuous data, showing bean rabbit population by year (years 0 to 8: 25, 33, 44, 64, 47, 73, 55, 50, 54). Right: BAR graph, use for comparing categories, showing illustrative area burned by vegetation type: conifer forest 9, shrub 7, grassland 4, hardwood forest 2 thousand hectares. Note: bean data over time should NOT be a bar graph." font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#1f2937">

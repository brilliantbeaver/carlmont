<rect x="257" y="185" width="206" height="16" fill="#1f2937"/>
<line x1="301" y1="193" x2="460" y2="193" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="269" y="197" font-size="11" font-weight="bold" fill="#ffffff">road</text>

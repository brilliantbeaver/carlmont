<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388" width="100%" role="img" aria-label="Three panels showing habitat fragmentation. 1 Continuous habitat: one big forest block with a large dark interior zone and a thin edge band. 2 Fragmented by road, development or fire: the same area cut into 4 pieces by a road and a strip of houses; each piece has its own edge band and a small interior. 3 Isolated small patches: small forest patches far apart, mostly edge with little or no interior; a wildlife corridor connects two patches. Labels: edge, interior, wildlife corridor." font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Habitat fragmentation: edge versus interior</title>
<defs><marker id="frag-concept-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="frag-concept-arrow-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6b46c1"/></marker></defs>
<text x="360" y="28" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Habitat fragmentation: same forest, more edge, less interior</text>
<circle cx="44.17" cy="62" r="10" fill="#1f2937"/>
<text x="44.17" y="66.5" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="129" y="67" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Continuous habitat</text>
<rect x="14" y="90" width="206" height="206" fill="#f6e7cb" stroke="#6b7280" stroke-width="1.2"/>
<text x="117" y="318" font-size="13" fill="#1f2937" text-anchor="middle">One big block:</text><text x="117" y="335" font-size="13" fill="#1f2937" text-anchor="middle">large interior, thin edge</text>
<circle cx="279.15" cy="67" r="10" fill="#1f2937"/>
<text x="279.15" y="71.5" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="372" y="63.5" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Fragmented by road /</text>
<text x="372" y="80.5" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">development / fire</text>
<rect x="257" y="90" width="206" height="206" fill="#f6e7cb" stroke="#6b7280" stroke-width="1.2"/>
<text x="360" y="318" font-size="13" fill="#1f2937" text-anchor="middle">Same area cut into 4 pieces</text><text x="360" y="335" font-size="13" fill="#1f2937" text-anchor="middle">by a road and houses</text>
<circle cx="518.36" cy="62" r="10" fill="#1f2937"/>
<text x="518.36" y="66.5" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="615" y="67" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Isolated small patches</text>
<rect x="500" y="90" width="206" height="206" fill="#f6e7cb" stroke="#6b7280" stroke-width="1.2"/>
<text x="603" y="318" font-size="13" fill="#1f2937" text-anchor="middle">Small patches far apart:</text><text x="603" y="335" font-size="13" fill="#1f2937" text-anchor="middle">mostly edge, little interior</text>
<line x1="226" y1="193.0" x2="252" y2="193.0" stroke="#1f2937" stroke-width="2.5" marker-end="url(#frag-concept-arrow)"/>
<line x1="469" y1="193.0" x2="495" y2="193.0" stroke="#1f2937" stroke-width="2.5" marker-end="url(#frag-concept-arrow)"/>
<rect x="34" y="110" width="166" height="166" fill="#2f855a" fill-opacity="0.42" stroke="#2f855a" stroke-width="1"/><rect x="49" y="125" width="136" height="136" fill="#2f855a"/>

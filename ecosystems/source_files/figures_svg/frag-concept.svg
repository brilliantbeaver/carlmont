<rect x="636" y="226" width="54" height="52" fill="#2f855a" fill-opacity="0.42" stroke="#2f855a" stroke-width="1"/><rect x="651" y="241" width="24" height="22" fill="#2f855a"/>
<rect x="588" y="200" width="30" height="28" fill="#2f855a" fill-opacity="0.42" stroke="#2f855a" stroke-width="1"/>

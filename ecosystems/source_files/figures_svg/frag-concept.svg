<text x="117" y="121.5" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">edge</text>
<text x="117" y="272.5" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">edge</text>

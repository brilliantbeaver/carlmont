<text x="604" y="167" font-size="12" font-weight="bold" fill="#6b46c1" text-anchor="middle">wildlife</text>
<text x="604" y="181" font-size="12" font-weight="bold" fill="#6b46c1" text-anchor="middle">corridor</text>
<line x1="603" y1="228" x2="603" y2="236" stroke="#1f2937" stroke-width="1"/>
<text x="603" y="248" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">all edge,</text>
<text x="603" y="261" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">no interior</text>
<rect x="49.76" y="356" width="16" height="16" fill="#2f855a"/><text x="71.76" y="369" font-size="12.5" fill="#1f2937">Interior habitat (deep forest)</text>
<rect x="251.63" y="356" width="16" height="16" fill="#2f855a" fill-opacity="0.42" stroke="#2f855a" stroke-width="1"/><text x="273.63" y="369" font-size="12.5" fill="#1f2937">Edge habitat (near boundary)</text>
<rect x="462.18" y="356" width="16" height="16" fill="#f6e7cb" stroke="#6b7280" stroke-width="1"/><text x="484.18" y="369" font-size="12.5" fill="#1f2937">Open / cleared land</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 476" width="100%" role="img" aria-label="Earth's four spheres. Earth sits in the center with four boxes around it: Atmosphere (air, wind, weather, climate, clouds), Hydrosphere (oceans, rivers, glaciers and sea ice, groundwater and aquifers, soil moisture), Biosphere (plants, animals, fungi, bacteria, algae), and Geosphere (rock, soil minerals, volcanoes, plate tectonics, earthquakes). Double-headed arrows connect the spheres to show they interact. The Sun at the top is the energy driver of most Earth-system interactions; Earth's core drives geosphere processes. Footer: Closed system: energy enters and leaves; very little matter does." font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="earth-spheres-title">Earth's four spheres and their energy sources</title>
  <defs>
    <marker id="earth-spheres-arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/>
    </marker>
    <marker id="earth-spheres-arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 Z" fill="#6b7280"/>
    </marker>
    <marker id="earth-spheres-sun-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d69e2e"/>
    </marker>
    <clipPath id="earth-spheres-globe-clip">
      <circle cx="360" cy="260" r="66"/>
    </clipPath>
  </defs>

  <!-- ===== SUN ===== -->
  <g stroke="#d69e2e" stroke-width="3" stroke-linecap="round">
    <line x1="385" y1="42" x2="392" y2="42"/>
    <line x1="335" y1="42" x2="328" y2="42"/>
    <line x1="360" y1="17" x2="360" y2="10"/>
    <line x1="377.7" y1="24.3" x2="382.6" y2="19.4"/>
    <line x1="342.3" y1="24.3" x2="337.4" y2="19.4"/>
    <line x1="377.7" y1="59.7" x2="382.6" y2="64.6"/>
    <line x1="342.3" y1="59.7" x2="337.4" y2="64.6"/>
  </g>
  <circle cx="360" cy="42" r="20" fill="#d69e2e"/>
  <circle cx="360" cy="42" r="13" fill="#f6e7cb" opacity="0.55"/>
  <text x="402" y="38" font-size="14" fill="#1f2937"><tspan font-weight="700">Sun</tspan> – energy driver of most</text>
  <text x="402" y="55" font-size="14" fill="#1f2937">Earth-system interactions</text>
  <!-- sunlight arrows -->
  <g fill="none" stroke="#d69e2e" stroke-width="2.5" marker-end="url(#earth-spheres-sun-arrow)">
    <path d="M336,76 q-6,7 0,14 t0,14 L336,120"/>
    <path d="M360,78 q-6,7 0,14 t0,14 L360,122"/>
    <path d="M384,76 q-6,7 0,14 t0,14 L384,120"/>
  </g>

  <!-- ===== DOUBLE-HEADED INTERACTION ARROWS ===== -->
  <g stroke="#6b7280" stroke-width="2.5" marker-start="url(#earth-spheres-arrow-start)" marker-end="url(#earth-spheres-arrow-end)">
    <line x1="258" y1="152" x2="462" y2="152"/>
    <line x1="258" y1="398" x2="462" y2="398"/>
    <line x1="135" y1="227" x2="135" y2="293"/>
    <line x1="585" y1="227" x2="585" y2="293"/>
  </g>

  <!-- ===== EARTH ===== -->
  <circle cx="360" cy="260" r="66" fill="#3182ce"/>
  <g clip-path="url(#earth-spheres-globe-clip)" fill="#2f855a">
    <path d="M300,214 C318,200 344,204 350,222 C356,238 334,246 326,262 C318,278 300,282 292,266 C284,250 288,224 300,214 Z"/>
    <path d="M368,206 C384,198 410,208 414,226 C418,242 396,244 384,238 C372,232 356,216 368,206 Z"/>
    <path d="M318,300 C330,292 348,298 350,312 C352,326 332,332 322,324 C312,316 310,306 318,300 Z"/>
  </g>
  <!-- cutaway to the core (lower-right quarter) -->
  <path d="M360,260 L426,260 A66,66 0 0,1 360,326 Z" fill="#8b5e34"/>
  <path d="M360,260 L420,260 A60,60 0 0,1 360,320 Z" fill="#dd6b20"/>
  <path d="M360,260 L396,260 A36,36 0 0,1 360,296 Z" fill="#c53030"/>
  <path d="M360,260 L378,260 A18,18 0 0,1 360,278 Z" fill="#d69e2e"/>
  <path d="M360,260 L426,260 M360,260 L360,326" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="360" cy="260" r="66" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <!-- core label -->
  <line x1="368" y1="270" x2="368" y2="336" stroke="#1f2937" stroke-width="1.2"/>
  <circle cx="368" cy="270" r="2.5" fill="#1f2937"/>
  <text x="360" y="352" font-size="13" text-anchor="middle" fill="#1f2937"><tspan font-weight="700">Earth's core</tspan> – drives</text>
  <text x="360" y="368" font-size="13" text-anchor="middle" fill="#1f2937">geosphere processes</text>

  <!-- ===== ATMOSPHERE (top-left) ===== -->
  <rect x="20" y="92" width="230" height="128" rx="10" fill="#ffffff" stroke="#3182ce" stroke-width="2"/>
  <path d="M20,120 V102 Q20,92 30,92 H240 Q250,92 250,102 V120 Z" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="34" y="111" font-size="15" font-weight="700" fill="#1f2937" letter-spacing="0.5">ATMOSPHERE</text>
  <g font-size="13" fill="#1f2937">
    <text x="36" y="140">• air</text>
    <text x="36" y="157">• wind</text>
    <text x="36" y="174">• weather</text>
    <text x="36" y="191">• climate</text>
    <text x="36" y="208">• clouds</text>
  </g>
  <g fill="#bee3f8" stroke="none">
    <circle cx="190" cy="162" r="12"/>
    <circle cx="206" cy="154" r="16"/>
    <circle cx="223" cy="163" r="11"/>
    <rect x="190" y="160" width="33" height="14" rx="6"/>
  </g>
  <g fill="none" stroke="#3182ce" stroke-width="2" stroke-linecap="round">
    <path d="M180,186 H214 Q222,186 222,180"/>
    <path d="M188,197 H226 Q234,197 234,203"/>
  </g>

  <!-- ===== HYDROSPHERE (top-right) ===== -->
  <rect x="470" y="92" width="230" height="128" rx="10" fill="#ffffff" stroke="#3182ce" stroke-width="2"/>
  <path d="M470,120 V102 Q470,92 480,92 H690 Q700,92 700,102 V120 Z" fill="#3182ce" stroke="#3182ce" stroke-width="2"/>
  <text x="484" y="111" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.5">HYDROSPHERE</text>
  <g font-size="13" fill="#1f2937">
    <text x="486" y="140">• oceans</text>
    <text x="486" y="157">• rivers</text>
    <text x="486" y="174">• glaciers &amp; sea ice</text>
    <text x="486" y="191">• groundwater/aquifers</text>
    <text x="486" y="208">• soil moisture</text>
  </g>
  <path d="M672,128 C672,128 660,143 660,151 A12,12 0 0,0 684,151 C684,143 672,128 672,128 Z" fill="#3182ce"/>
  <g fill="none" stroke="#3182ce" stroke-width="2" stroke-linecap="round">
    <path d="M648,173 q6,-5 12,0 t12,0 t12,0 t6,0"/>
  </g>

  <!-- ===== BIOSPHERE (bottom-left) ===== -->
  <rect x="20" y="300" width="230" height="128" rx="10" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
  <path d="M20,328 V310 Q20,300 30,300 H240 Q250,300 250,310 V328 Z" fill="#2f855a" stroke="#2f855a" stroke-width="2"/>
  <text x="34" y="319" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.5">BIOSPHERE</text>
  <g font-size="13" fill="#1f2937">
    <text x="36" y="348">• plants</text>
    <text x="36" y="365">• animals</text>
    <text x="36" y="382">• fungi</text>
    <text x="36" y="399">• bacteria</text>
    <text x="36" y="416">• algae</text>
  </g>
  <rect x="202" y="378" width="9" height="30" fill="#8b5e34"/>
  <g fill="#2f855a">
    <circle cx="206" cy="362" r="17"/>
    <circle cx="192" cy="374" r="11"/>
    <circle cx="221" cy="374" r="11"/>
  </g>
  <line x1="180" y1="408" x2="234" y2="408" stroke="#8b5e34" stroke-width="2" stroke-linecap="round"/>

  <!-- ===== GEOSPHERE (bottom-right) ===== -->
  <rect x="470" y="300" width="230" height="128" rx="10" fill="#ffffff" stroke="#8b5e34" stroke-width="2"/>
  <path d="M470,328 V310 Q470,300 480,300 H690 Q700,300 700,310 V328 Z" fill="#8b5e34" stroke="#8b5e34" stroke-width="2"/>
  <text x="484" y="319" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.5">GEOSPHERE</text>
  <g font-size="13" fill="#1f2937">
    <text x="486" y="348">• rock</text>
    <text x="486" y="365">• soil minerals</text>
    <text x="486" y="382">• volcanoes</text>
    <text x="486" y="399">• plate tectonics</text>
    <text x="486" y="416">• earthquakes</text>
  </g>
  <circle cx="660" cy="350" r="7" fill="#e5e7eb"/>
  <circle cx="670" cy="343" r="6" fill="#e5e7eb"/>
  <path d="M624,408 L650,366 L662,366 L688,408 Z" fill="#8b5e34"/>
  <path d="M650,366 L662,366 L659,376 L653,376 Z" fill="#dd6b20"/>
  <line x1="618" y1="408" x2="694" y2="408" stroke="#8b5e34" stroke-width="2" stroke-linecap="round"/>

  <!-- ===== FOOTER ===== -->
  <rect x="100" y="440" width="520" height="30" rx="15" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="360" y="460" font-size="14" text-anchor="middle" fill="#1f2937"><tspan font-weight="700">Closed system:</tspan> energy enters &amp; leaves; very little matter does.</text>
</svg>

<text x="166" y="88.5" font-size="13.5" fill="#1f2937">(CZU Lightning Complex)</text>
<text x="118" y="80" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="end">Aug 16, 2020</text>
<line x1="132" y1="75.5" x2="150" y2="75.5" stroke="#e5e7eb" stroke-width="1.2"/>

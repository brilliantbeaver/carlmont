<text x="166" y="183.5" font-size="13.5" font-weight="bold" fill="#1f2937">&gt;97% of Big Basin Redwoods SP burned</text>
<text x="166" y="201" font-size="13.5" fill="#1f2937">(CA's oldest state park, 1902)</text>
<text x="118" y="192.5" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="end">Aug 2020</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="100%" role="img" aria-label="Timeline of the CZU Lightning Complex fire. Aug 16, 2020: a dry-lightning storm ignites fires (CZU Lightning Complex). Wind, steep slopes and dry fuels cause rapid spread. More than 97% of Big Basin Redwoods State Park burned (California's oldest state park, 1902). Sept 22, 2020: contained at 86,509 acres; about 1,490 structures destroyed. Weeks to months later: redwoods resprout from trunk buds and burls, the understory regrows, and knobcone pine seeds are released. Ongoing: secondary succession, the park is reimagined, and prescribed fire reduces fuel. Icon: redwood cross-section with thick bark (up to about 1 foot)." font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>CZU Lightning Complex and Big Basin timeline</title>
<defs><marker id="czu-timeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="czu-timeline-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<text x="360" y="26" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">CZU Lightning Complex fire &amp; Big Basin Redwoods State Park</text>

<text x="166" y="136" font-size="13.5" fill="#1f2937">Wind + steep slopes + dry fuels → rapid spread</text>
<text x="118" y="136.25" font-size="12.5" font-weight="bold" fill="#6b7280" text-anchor="end" font-style="italic">Why so fast?</text>
<line x1="132" y1="131.75" x2="150" y2="131.75" stroke="#e5e7eb" stroke-width="1.2"/>
<rect x="150" y="162.5" width="372" height="51" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>

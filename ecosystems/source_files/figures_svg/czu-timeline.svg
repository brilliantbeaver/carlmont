<text x="166" y="331" font-size="13.5" fill="#1f2937">understory regrows; knobcone pine seeds released</text>
<text x="118" y="314.5" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="end">Weeks–months</text>
<text x="118" y="330.5" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="end">later</text>

  <line x1="182.0" y1="223.0" x2="182.0" y2="234" stroke="#6b7280" stroke-width="2" marker-end="url(#atlas-cascade-arrow)"/>
  <path d="M182.0,284 V297.0 H98.0 M182.0,297.0 H266.0" fill="none" stroke="#6b7280" stroke-width="2"/>
  <line x1="98.0" y1="297.0" x2="98.0" y2="308" stroke="#6b7280" stroke-width="2" marker-end="url(#atlas-cascade-arrow)"/>
  <line x1="266.0" y1="297.0" x2="266.0" y2="308" stroke="#6b7280" stroke-width="2" marker-end="url(#atlas-cascade-arrow)"/>
  <path d="M98.0,358 V371.0 H266.0 V358" fill="none" stroke="#6b7280" stroke-width="2"/>
  <line x1="182.0" y1="371.0" x2="182.0" y2="382" stroke="#6b7280" stroke-width="2" marker-end="url(#atlas-cascade-arrow)"/>
  <rect x="366" y="40" width="344" height="402" rx="10" fill="#f9fafb" stroke="#2f855a" stroke-width="1.5"/>
  <path d="M366,72 V50 Q366,40 376,40 H700 Q710,40 710,50 V72 Z" fill="#2f855a"/>
  <text x="538.0" y="62" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">Wolves reintroduced (5 yrs)</text>
  <rect x="438.0" y="88" width="200" height="48" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.6"/>
  <text x="538.0" y="109" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">Wolves 97</text>
  <text x="538.0" y="126" font-size="12" text-anchor="middle" fill="#6b7280">normal 95–120</text>
  <circle cx="637.0" cy="89" r="8" fill="#2f855a"/><path d="M633.0,89 L636.0,92 L641.5,85.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="374" y="162" width="160.0" height="48" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.6"/>
  <text x="454.0" y="183" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Deer 7,000</text>
  <text x="454.0" y="200" font-size="12" text-anchor="middle" fill="#6b7280">normal 4,000–8,000</text>
  <circle cx="533.0" cy="163" r="8" fill="#2f855a"/><path d="M529.0,163 L532.0,166 L537.5,159.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="542.0" y="162" width="160.0" height="48" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.6"/>
  <text x="622.0" y="183" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Coyotes 270</text>
  <text x="622.0" y="200" font-size="12" text-anchor="middle" fill="#6b7280">normal 250–300</text>
  <circle cx="701.0" cy="163" r="8" fill="#2f855a"/><path d="M697.0,163 L700.0,166 L705.5,159.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="420.0" y="236" width="236" height="48" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.6"/>
  <text x="538.0" y="257" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">Grass 850 blades/m²</text>
  <text x="538.0" y="274" font-size="12" text-anchor="middle" fill="#6b7280">normal 800–1,000 blades/m²</text>
  <circle cx="655.0" cy="237" r="8" fill="#2f855a"/><path d="M651.0,237 L654.0,240 L659.5,233.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="374" y="310" width="160.0" height="48" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.6"/>
  <text x="454.0" y="331" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Bees 4,250 hives</text>
  <text x="454.0" y="348" font-size="12" text-anchor="middle" fill="#6b7280">normal 4,000–5,000</text>
  <circle cx="533.0" cy="311" r="8" fill="#2f855a"/><path d="M529.0,311 L532.0,314 L537.5,307.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="542.0" y="310" width="160.0" height="48" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.6"/>
  <text x="622.0" y="331" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Ravens 245</text>
  <text x="622.0" y="348" font-size="12" text-anchor="middle" fill="#6b7280">normal 220–270</text>
  <circle cx="701.0" cy="311" r="8" fill="#2f855a"/><path d="M697.0,311 L700.0,314 L705.5,307.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="408.0" y="384" width="260" height="48" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <text x="538.0" y="405" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">All within normal range</text>
  <text x="538.0" y="423" font-size="14" font-weight="700" text-anchor="middle" fill="#2f855a">= equilibrium restored</text>
  <path d="M538.0,136 V149.0 H454.0 M538.0,149.0 H622.0" fill="none" stroke="#6b7280" stroke-width="2"/>
  <line x1="454.0" y1="149.0" x2="454.0" y2="160" stroke="#6b7280" stroke-width="2" marker-end="url(#atlas-cascade-arrow)"/>
  <line x1="622.0" y1="149.0" x2="622.0" y2="160" stroke="#6b7280" stroke-width="2" marker-end="url(#atlas-cascade-arrow)"/>
  <path d="M454.0,210 V223.0 H622.0 V210" fill="none" stroke="#6b7280" stroke-width="2"/>
  <line x1="538.0" y1="223.0" x2="538.0" y2="234" stroke="#6b7280" stroke-width="2" marker-end="url(#atlas-cascade-arrow)"/>
  <path d="M538.0,284 V297.0 H454.0 M538.0,297.0 H622.0" fill="none" stroke="#6b7280" stroke-width="2"/>
  <line x1="454.0" y1="297.0" x2="454.0" y2="308" stroke="#6b7280" stroke-width="2" marker-end="url(#atlas-cascade-arrow)"/>
  <line x1="622.0" y1="297.0" x2="622.0" y2="308" stroke="#6b7280" stroke-width="2" marker-end="url(#atlas-cascade-arrow)"/>
  <path d="M454.0,358 V371.0 H622.0 V358" fill="none" stroke="#6b7280" stroke-width="2"/>
  <line x1="538.0" y1="371.0" x2="538.0" y2="382" stroke="#6b7280" stroke-width="2" marker-end="url(#atlas-cascade-arrow)"/>
  <g font-size="13" fill="#1f2937">
    <text x="60" y="462"><tspan fill="#c53030" font-weight="700">↑</tspan> above normal range</text>
    <text x="230" y="462"><tspan fill="#c53030" font-weight="700">↓</tspan> below normal range</text>
  </g>
  <circle cx="412" cy="457.5" r="8" fill="#2f855a"/><path d="M408,457.5 L411,460.5 L416.5,454.0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="426" y="462" font-size="13" fill="#1f2937">within normal range</text>
  <text x="572" y="462" font-size="13" fill="#6b7280">gray = normal range</text>
</svg>

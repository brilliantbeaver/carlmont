<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 476" width="100%" role="img" aria-label="Atlas National Park trophic cascade from the Gizmo, in two columns. Left column, wolves removed: wolves 0 (normal 95 to 120); deer rise to 15,000 (normal 4,000 to 8,000) and coyotes rise to 600 (normal 250 to 300); grass falls to 400 blades per square meter (normal 800 to 1,000); bees fall to 2,000 hives (normal 4,000 to 5,000) and ravens fall to 160 (normal 220 to 270); all out of normal range, ecosystem out of balance. Right column, wolves reintroduced after 5 years: wolves 97, deer 7,000, coyotes 270, grass 850 blades per square meter, bees 4,250 hives, ravens 245; all within normal range, equilibrium restored." font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Keystone species: wolves in Atlas National Park (Gizmo) trophic cascade</title>
  <defs>
    <marker id="atlas-cascade-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker>
  </defs>
  <text x="360" y="24" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937">Keystone species: wolves in Atlas National Park (Gizmo)</text>
  <rect x="10" y="40" width="344" height="402" rx="10" fill="#f9fafb" stroke="#c53030" stroke-width="1.5"/>
  <path d="M10,72 V50 Q10,40 20,40 H344 Q354,40 354,50 V72 Z" fill="#c53030"/>
  <text x="182.0" y="62" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">Wolves removed</text>
  <rect x="82.0" y="88" width="200" height="48" rx="8" fill="#ffffff" stroke="#c53030" stroke-width="1.6"/>
  <text x="182.0" y="109" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">Wolves <tspan fill="#c53030">↓</tspan> 0</text>
  <text x="182.0" y="126" font-size="12" text-anchor="middle" fill="#6b7280">normal 95–120</text>
  <rect x="18" y="162" width="160.0" height="48" rx="8" fill="#ffffff" stroke="#c53030" stroke-width="1.6"/>
  <text x="98.0" y="183" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Deer <tspan fill="#c53030">↑</tspan> 15,000</text>
  <text x="98.0" y="200" font-size="12" text-anchor="middle" fill="#6b7280">normal 4,000–8,000</text>
  <rect x="186.0" y="162" width="160.0" height="48" rx="8" fill="#ffffff" stroke="#c53030" stroke-width="1.6"/>
  <text x="266.0" y="183" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Coyotes <tspan fill="#c53030">↑</tspan> 600</text>
  <text x="266.0" y="200" font-size="12" text-anchor="middle" fill="#6b7280">normal 250–300</text>
  <rect x="64.0" y="236" width="236" height="48" rx="8" fill="#ffffff" stroke="#c53030" stroke-width="1.6"/>
  <text x="182.0" y="257" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">Grass <tspan fill="#c53030">↓</tspan> 400 blades/m²</text>
  <text x="182.0" y="274" font-size="12" text-anchor="middle" fill="#6b7280">normal 800–1,000 blades/m²</text>
  <rect x="18" y="310" width="160.0" height="48" rx="8" fill="#ffffff" stroke="#c53030" stroke-width="1.6"/>
  <text x="98.0" y="331" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Bees <tspan fill="#c53030">↓</tspan> 2,000 hives</text>
  <text x="98.0" y="348" font-size="12" text-anchor="middle" fill="#6b7280">normal 4,000–5,000</text>
  <rect x="186.0" y="310" width="160.0" height="48" rx="8" fill="#ffffff" stroke="#c53030" stroke-width="1.6"/>
  <text x="266.0" y="331" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Ravens <tspan fill="#c53030">↓</tspan> 160</text>
  <text x="266.0" y="348" font-size="12" text-anchor="middle" fill="#6b7280">normal 220–270</text>
  <rect x="52.0" y="384" width="260" height="48" rx="8" fill="#ffffff" stroke="#c53030" stroke-width="2"/>
  <text x="182.0" y="405" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">All out of normal range</text>
  <text x="182.0" y="423" font-size="14" font-weight="700" text-anchor="middle" fill="#c53030">= ecosystem out of balance</text>
  <path d="M182.0,136 V149.0 H98.0 M182.0,149.0 H266.0" fill="none" stroke="#6b7280" stroke-width="2"/>

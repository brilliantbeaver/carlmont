<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" width="100%" role="img" aria-label="Stylized line graph, illustrative not real data, of population in thousands versus year from 1850 to 1910. The snowshoe hare line (solid blue) rises and falls in a cycle of about 10 years, peaking near 120 thousand in 1855, 1865, 1875, 1885, 1895 and 1905. The lynx line (dashed orange) has lower peaks near 40 thousand, each about 1.5 years after a hare peak. Caption: stylized after Hudson's Bay Company fur records; about 10-year cycle; predator peaks lag prey peaks." font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="100%" role="img" aria-label="Graph of population size versus time. 2: exponential growth, a steep rise. 1: overshoot, a big peak far above the dashed carrying-capacity line. 4: decline (die-off), a sharp fall to below the line. 5: recovery, the rise after the lowest trough. 3: carrying capacity, the dashed line; smaller oscillations then converge on it." font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="100%" role="img" aria-label="Graph of population size versus time or number of generations. A: slow start (lag) at bottom left. B: steep rise, exponential growth. C: curve bends as growth slows because of limiting factors. D: dashed horizontal line, carrying capacity K. E and G: small peaks above K; F and H: small dips below K; E to H shows cyclical or periodic fluctuation around K." font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">

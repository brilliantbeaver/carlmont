    <marker id="food-chain-arrows-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c53030"/></marker>
  </defs>
  <text x="360" y="22" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Which way should food-chain arrows point?</text>

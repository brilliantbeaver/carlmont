<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" width="100%" role="img" aria-label="Two versions of the same food chain. A, correct: redwood sorrel arrow to mule deer arrow to puma, labeled: arrows follow energy, from food to eater. B, incorrect: puma arrow to mule deer arrow to redwood sorrel, labeled: arrows point to the food, which is wrong." font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Food chain arrow direction: correct vs. incorrect</title>

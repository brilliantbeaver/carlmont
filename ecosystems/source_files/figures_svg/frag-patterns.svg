<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" width="100%" role="img" aria-label="Six 10 by 10 grids, each with 50 gray forest cells and 50 white meadow cells. A Checkerboard: forest and meadow cells alternate. B Random: forest cells scattered randomly. C Stripes: gray forest in columns 1, 4, 5, 8 and 9; white meadow in columns 2, 3, 6, 7 and 10. D Four Areas: forest in the top-left 5 by 5 block and the bottom-right 5 by 5 block; the other two quadrants are meadow. E Diamond: one central diamond-shaped patch of forest. F Two Areas: the left 5 columns are forest and the right 5 columns are meadow. Legend: gray = forest (canopy intact), white = meadow (burned, now open). Same amount of forest (50%), different patterns." font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">

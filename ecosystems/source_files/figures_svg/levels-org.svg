<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 449" width="100%" role="img" aria-label="Nested rounded rectangles showing levels of organization. Innermost: Organism, one mule deer. Inside Population, a herd of mule deer. Inside Community, all species in Big Basin such as deer, pumas, redwoods and fungi. Inside Ecosystem, the community plus abiotic factors such as water, sunlight, soil and temperature; highlighted: Ecosystem equals biotic plus abiotic interacting. Inside Biome, temperate coniferous forest. Outermost: Biosphere, all life on Earth." font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#1f2937">
<title>Levels of organization: organism, population, community, ecosystem, biome, biosphere</title>
<text x="360" y="28" font-size="17" font-weight="bold" text-anchor="middle">Levels of organization in ecology</text>
<rect x="10" y="44" width="700" height="347" rx="12" fill="#eef6fc" stroke="#3182ce" stroke-width="1.6"/>
<text x="24" y="66" font-size="13" xml:space="preserve"><tspan font-weight="bold" fill="#3182ce">BIOSPHERE — </tspan><tspan>all life on Earth and every place it lives (all ecosystems together)</tspan></text>

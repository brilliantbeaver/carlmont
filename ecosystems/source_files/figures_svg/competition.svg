<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-label="Two kinds of competition. Left panel, intraspecific competition (same species): several gulls crowd onto one nesting rock and two more gulls fly overhead with no room left to nest. Right panel, interspecific competition (different species): a coyote and a bobcat both reach for the same single rabbit." font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Intraspecific vs. interspecific competition</title>

  <!-- ===================== INTRASPECIFIC ===================== -->
  <rect x="12" y="10" width="342" height="280" rx="10" fill="#ffffff" stroke="#3182ce" stroke-width="2"/>
  <path d="M12,40 V20 Q12,10 22,10 H344 Q354,10 354,20 V40 Z" fill="#3182ce" stroke="#3182ce" stroke-width="2"/>
  <text x="183" y="31" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff" letter-spacing="0.4">INTRASPECIFIC COMPETITION</text>
  <text x="183" y="60" font-size="14" text-anchor="middle" fill="#1f2937">within the <tspan font-weight="700">SAME</tspan> species</text>

  <!-- water -->
  <rect x="24" y="196" width="318" height="26" rx="4" fill="#bee3f8"/>
  <g fill="none" stroke="#3182ce" stroke-width="1.5" stroke-linecap="round">
    <path d="M34,206 q6,-4 12,0 t12,0"/>
    <path d="M292,210 q6,-4 12,0 t12,0"/>
    <path d="M54,216 q6,-4 12,0 t12,0"/>
  </g>
  <!-- rock -->
  <path d="M86,214 L104,172 L130,152 L236,150 L262,170 L280,214 Z" fill="#e5e7eb" stroke="#6b7280" stroke-width="2" stroke-linejoin="round"/>
  <path d="M150,176 L162,186 L158,196 M224,170 L232,184" fill="none" stroke="#6b7280" stroke-width="1.2"/>
  <text x="183" y="203" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">one nesting rock</text>

  <!-- nests -->
  <path d="M124,151 Q134,160 144,151 Z" fill="#8b5e34"/>
  <path d="M222,151 Q232,160 242,151 Z" fill="#8b5e34"/>

  <!-- standing gulls (same species): drawn facing right at origin = feet; scale(-1 1) mirrors -->
  <g transform="translate(112 166) scale(-1 1)">
    <g stroke="#d69e2e" stroke-width="2" stroke-linecap="round"><line x1="-3" y1="-8" x2="-4" y2="0"/><line x1="3" y1="-8" x2="3" y2="0"/></g>
    <ellipse cx="0" cy="-16" rx="13" ry="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
    <path d="M-12,-18 Q-2,-25 9,-18 Q0,-13 -12,-18 Z" fill="#6b7280"/>
    <path d="M-12,-19 L-20,-21 L-13,-15 Z" fill="#1f2937"/>
    <circle cx="11" cy="-27" r="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
    <path d="M16.5,-28 L23,-26.5 L16.5,-25 Z" fill="#d69e2e"/>
    <circle cx="12.5" cy="-28.5" r="1.1" fill="#1f2937"/>
  </g>
  <g transform="translate(254 164)">
    <g stroke="#d69e2e" stroke-width="2" stroke-linecap="round"><line x1="-3" y1="-8" x2="-4" y2="0"/><line x1="3" y1="-8" x2="3" y2="0"/></g>
    <ellipse cx="0" cy="-16" rx="13" ry="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
    <path d="M-12,-18 Q-2,-25 9,-18 Q0,-13 -12,-18 Z" fill="#6b7280"/>
    <path d="M-12,-19 L-20,-21 L-13,-15 Z" fill="#1f2937"/>
    <circle cx="11" cy="-27" r="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
    <path d="M16.5,-28 L23,-26.5 L16.5,-25 Z" fill="#d69e2e"/>
    <circle cx="12.5" cy="-28.5" r="1.1" fill="#1f2937"/>
  </g>
  <g transform="translate(134 151) scale(-1 1)">
    <g stroke="#d69e2e" stroke-width="2" stroke-linecap="round"><line x1="-3" y1="-8" x2="-4" y2="0"/><line x1="3" y1="-8" x2="3" y2="0"/></g>
    <ellipse cx="0" cy="-16" rx="13" ry="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
    <path d="M-12,-18 Q-2,-25 9,-18 Q0,-13 -12,-18 Z" fill="#6b7280"/>
    <path d="M-12,-19 L-20,-21 L-13,-15 Z" fill="#1f2937"/>
    <circle cx="11" cy="-27" r="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
    <path d="M16.5,-28 L23,-26.5 L16.5,-25 Z" fill="#d69e2e"/>
    <circle cx="12.5" cy="-28.5" r="1.1" fill="#1f2937"/>
  </g>
  <g transform="translate(164 151) scale(-1 1)">
    <g stroke="#d69e2e" stroke-width="2" stroke-linecap="round"><line x1="-3" y1="-8" x2="-4" y2="0"/><line x1="3" y1="-8" x2="3" y2="0"/></g>
    <ellipse cx="0" cy="-16" rx="13" ry="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
    <path d="M-12,-18 Q-2,-25 9,-18 Q0,-13 -12,-18 Z" fill="#6b7280"/>
    <path d="M-12,-19 L-20,-21 L-13,-15 Z" fill="#1f2937"/>
    <circle cx="11" cy="-27" r="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
    <path d="M16.5,-28 L23,-26.5 L16.5,-25 Z" fill="#d69e2e"/>
    <circle cx="12.5" cy="-28.5" r="1.1" fill="#1f2937"/>
  </g>
  <g transform="translate(202 151)">
    <g stroke="#d69e2e" stroke-width="2" stroke-linecap="round"><line x1="-3" y1="-8" x2="-4" y2="0"/><line x1="3" y1="-8" x2="3" y2="0"/></g>
    <ellipse cx="0" cy="-16" rx="13" ry="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
    <path d="M-12,-18 Q-2,-25 9,-18 Q0,-13 -12,-18 Z" fill="#6b7280"/>
    <path d="M-12,-19 L-20,-21 L-13,-15 Z" fill="#1f2937"/>
    <circle cx="11" cy="-27" r="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
    <path d="M16.5,-28 L23,-26.5 L16.5,-25 Z" fill="#d69e2e"/>
    <circle cx="12.5" cy="-28.5" r="1.1" fill="#1f2937"/>
  </g>
  <g transform="translate(232 151)">
    <g stroke="#d69e2e" stroke-width="2" stroke-linecap="round"><line x1="-3" y1="-8" x2="-4" y2="0"/><line x1="3" y1="-8" x2="3" y2="0"/></g>
    <ellipse cx="0" cy="-16" rx="13" ry="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
    <path d="M-12,-18 Q-2,-25 9,-18 Q0,-13 -12,-18 Z" fill="#6b7280"/>
    <path d="M-12,-19 L-20,-21 L-13,-15 Z" fill="#1f2937"/>
    <circle cx="11" cy="-27" r="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
    <path d="M16.5,-28 L23,-26.5 L16.5,-25 Z" fill="#d69e2e"/>
    <circle cx="12.5" cy="-28.5" r="1.1" fill="#1f2937"/>
  </g>
  <!-- flying gulls with no room -->
  <g fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M68,96 Q77,85 86,94 Q95,85 104,96"/>
    <path d="M262,90 Q271,79 280,88 Q289,79 298,90"/>
  </g>
  <ellipse cx="86" cy="95" rx="3.5" ry="2.5" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
  <ellipse cx="280" cy="89" rx="3.5" ry="2.5" fill="#ffffff" stroke="#1f2937" stroke-width="1.2"/>
  <text x="183" y="98" font-size="12" font-style="italic" text-anchor="middle" fill="#6b7280">no room left to nest</text>
  <path d="M120,94 L110,94 M246,94 L256,94" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>

  <text x="183" y="252" font-size="13" text-anchor="middle" fill="#1f2937">Gulls compete with other gulls for</text>
  <text x="183" y="270" font-size="13" text-anchor="middle" fill="#1f2937">limited <tspan font-weight="700">nesting space</tspan> on one rock.</text>

  <!-- ===================== INTERSPECIFIC ===================== -->
  <rect x="366" y="10" width="342" height="280" rx="10" fill="#ffffff" stroke="#dd6b20" stroke-width="2"/>
  <path d="M366,40 V20 Q366,10 376,10 H698 Q708,10 708,20 V40 Z" fill="#dd6b20" stroke="#dd6b20" stroke-width="2"/>
  <text x="537" y="31" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff" letter-spacing="0.4">INTERSPECIFIC COMPETITION</text>
  <text x="537" y="60" font-size="14" text-anchor="middle" fill="#1f2937">between <tspan font-weight="700">DIFFERENT</tspan> species</text>

  <!-- ground -->
  <line x1="380" y1="200" x2="694" y2="200" stroke="#8b5e34" stroke-width="2" stroke-linecap="round"/>
  <g fill="none" stroke="#2f855a" stroke-width="1.5" stroke-linecap="round">
    <path d="M392,200 l-3,-7 M396,200 l0,-9 M400,200 l3,-7"/>
    <path d="M676,200 l-3,-7 M680,200 l0,-9 M684,200 l3,-7"/>
  </g>

  <!-- coyote (facing right) -->
  <g transform="translate(446 171)">
    <path d="M-27,-5 Q-46,0 -50,20 Q-40,12 -25,4 Z" fill="#6b7280"/>
    <g stroke="#6b7280" stroke-width="4.5" stroke-linecap="round">
      <line x1="-20" y1="5" x2="-23" y2="28"/>
      <line x1="-11" y1="7" x2="-11" y2="28"/>
      <line x1="16" y1="7" x2="17" y2="28"/>
      <line x1="22" y1="2" x2="50" y2="16"/>
    </g>
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="#6b7280"/>
    <path d="M18,-6 L28,-16 L36,-8 L28,4 Z" fill="#6b7280"/>
    <ellipse cx="34" cy="-15" rx="11" ry="8" fill="#6b7280"/>
    <path d="M40,-19 L57,-12 L42,-8 Z" fill="#6b7280"/>
    <path d="M27,-20 L29,-35 L36,-22 Z M33,-21 L39,-34 L41,-19 Z" fill="#6b7280"/>
    <circle cx="57" cy="-12" r="2" fill="#1f2937"/>
    <circle cx="38" cy="-17" r="1.6" fill="#ffffff"/>
  </g>

  <!-- rabbit -->
  <g>
    <ellipse cx="527" cy="160" rx="2.8" ry="9" fill="#8b5e34" transform="rotate(-12 527 160)"/>
    <ellipse cx="534" cy="160" rx="2.8" ry="9" fill="#8b5e34" transform="rotate(10 534 160)"/>
    <ellipse cx="540" cy="189" rx="14" ry="10.5" fill="#8b5e34"/>
    <circle cx="530" cy="176" r="7.5" fill="#8b5e34"/>
    <circle cx="553" cy="187" r="3.8" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
    <circle cx="527" cy="175" r="1.4" fill="#1f2937"/>
  </g>

  <!-- bobcat (facing left) -->
  <g transform="translate(626 172)">
    <line x1="22" y1="-5" x2="31" y2="-10" stroke="#d69e2e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="32" cy="-10.5" r="3" fill="#1f2937"/>
    <g stroke="#d69e2e" stroke-width="4.5" stroke-linecap="round">
      <line x1="13" y1="7" x2="13" y2="27"/>
      <line x1="20" y1="4" x2="22" y2="27"/>
      <line x1="-13" y1="7" x2="-14" y2="27"/>
      <line x1="-18" y1="2" x2="-46" y2="15"/>
    </g>
    <ellipse cx="0" cy="0" rx="26" ry="12" fill="#d69e2e"/>
    <g fill="#8b5e34">
      <circle cx="-8" cy="-4" r="2"/><circle cx="2" cy="-6" r="2"/><circle cx="12" cy="-3" r="2"/>
      <circle cx="-2" cy="3" r="2"/><circle cx="8" cy="4" r="2"/><circle cx="16" cy="2" r="1.8"/>
    </g>
    <circle cx="-29" cy="-14" r="11" fill="#d69e2e"/>
    <path d="M-38,-20 L-39,-33 L-31,-23 Z M-27,-24 L-23,-36 L-19,-22 Z" fill="#d69e2e"/>
    <path d="M-39,-32 L-39.5,-36 M-23,-35 L-22.5,-39" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-34" cy="-16" r="1.6" fill="#1f2937"/>
    <circle cx="-39" cy="-12" r="1.8" fill="#1f2937"/>
  </g>

  <!-- labels -->
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">
    <text x="440" y="222">coyote</text>
    <text x="540" y="222">rabbit</text>
    <text x="630" y="222">bobcat</text>
  </g>

  <text x="537" y="252" font-size="13" text-anchor="middle" fill="#1f2937">Coyote and bobcat compete for the</text>
  <text x="537" y="270" font-size="13" text-anchor="middle" fill="#1f2937">same limited <tspan font-weight="700">food</tspan>: one rabbit.</text>
</svg>

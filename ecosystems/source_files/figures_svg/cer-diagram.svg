<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 459" width="100%" role="img" aria-label="CER diagram with three linked boxes. CLAIM: one sentence that answers the question; example: Reintroducing wolves restored equilibrium in Atlas National Park. EVIDENCE: data, qualitative and quantitative, with units; example: after 5 years, deer fell from 15,000 to 7,000 and grass rose from 400 to 850 blades per square meter, both back in normal range. An arrow shows evidence supports the claim. REASONING: science concept that explains why the evidence supports the claim; example: wolves are a keystone predator; they limit deer, so grass recovers, which supports bees and other species, a trophic cascade. An arrow shows reasoning links evidence to claim. Ask: What? How do you know? Why does it matter (science)?" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#1f2937">
<title>Claim, Evidence, Reasoning (CER) diagram</title>
<defs>
<marker id="cer-diagram-arrow-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3182ce"/></marker>
<marker id="cer-diagram-arrow-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker>
</defs>
<text x="360" y="28" font-size="17" font-weight="bold" text-anchor="middle">CER: Claim – Evidence – Reasoning</text>
<rect x="16" y="48" width="272" height="156.5" rx="10" fill="#f3effc" stroke="#6b46c1" stroke-width="2"/>
<path d="M26,48 h252 a10,10 0 0 1 10,10 v24 h-272 v-24 a10,10 0 0 1 10,-10 z" fill="#6b46c1"/>
<text x="30" y="71" font-size="16" font-weight="bold" fill="#ffffff">CLAIM</text>
<text x="274" y="70" font-size="12.5" fill="#ffffff" text-anchor="end" font-style="italic">Ask: What?</text>
<text x="30" y="107" font-size="13.5" font-weight="bold">One sentence that answers the</text>
<text x="30" y="125" font-size="13.5" font-weight="bold">question</text>
<line x1="30" y1="139" x2="274" y2="139" stroke="#6b46c1" stroke-dasharray="3 3"/>
<text x="30" y="155" font-size="13" fill="#374151" font-style="italic">Ex: “Reintroducing wolves restored</text>
<text x="30" y="172.5" font-size="13" fill="#374151" font-style="italic">equilibrium in Atlas National Park.”</text>
<rect x="386" y="48" width="318" height="156.5" rx="10" fill="#ebf5fd" stroke="#3182ce" stroke-width="2"/>
<path d="M396,48 h298 a10,10 0 0 1 10,10 v24 h-318 v-24 a10,10 0 0 1 10,-10 z" fill="#3182ce"/>
<text x="400" y="71" font-size="16" font-weight="bold" fill="#ffffff">EVIDENCE</text>
<text x="690" y="70" font-size="12.5" fill="#ffffff" text-anchor="end" font-style="italic">Ask: How do you know?</text>
<text x="400" y="107" font-size="13.5" font-weight="bold">Data, qualitative &amp; quantitative,</text>
<text x="400" y="125" font-size="13.5" font-weight="bold">WITH UNITS</text>
<line x1="400" y1="139" x2="690" y2="139" stroke="#3182ce" stroke-dasharray="3 3"/>
<text x="400" y="155" font-size="13" fill="#374151" font-style="italic">Ex: “After 5 years, deer fell from 15,000 to</text>
<text x="400" y="172.5" font-size="13" fill="#374151" font-style="italic">7,000 and grass rose from 400 to 850</text>
<text x="400" y="190" font-size="13" fill="#374151" font-style="italic">blades/m², both back in normal range.”</text>
<line x1="382" y1="132.25" x2="292" y2="132.25" stroke="#3182ce" stroke-width="3" marker-end="url(#cer-diagram-arrow-e)"/>
<text x="337" y="120.25" font-size="13" font-weight="bold" fill="#3182ce" text-anchor="middle">supports</text>
<rect x="120" y="258.5" width="480" height="156.5" rx="10" fill="#eefaf2" stroke="#2f855a" stroke-width="2"/>
<path d="M130,258.5 h460 a10,10 0 0 1 10,10 v24 h-480 v-24 a10,10 0 0 1 10,-10 z" fill="#2f855a"/>
<text x="134" y="281.5" font-size="16" font-weight="bold" fill="#ffffff">REASONING</text>
<text x="586" y="280.5" font-size="12.5" fill="#ffffff" text-anchor="end" font-style="italic">Ask: Why does it matter (science)?</text>
<text x="134" y="317.5" font-size="13.5" font-weight="bold">Science concept that explains WHY the evidence supports</text>
<text x="134" y="335.5" font-size="13.5" font-weight="bold">the claim</text>
<line x1="134" y1="349.5" x2="586" y2="349.5" stroke="#2f855a" stroke-dasharray="3 3"/>
<text x="134" y="365.5" font-size="13" fill="#374151" font-style="italic">Ex: “Wolves are a keystone predator; they limit deer, so grass</text>
<text x="134" y="383" font-size="13" fill="#374151" font-style="italic">recovers, which supports bees and other species — a trophic</text>
<text x="134" y="400.5" font-size="13" fill="#374151" font-style="italic">cascade.”</text>
<line x1="337" y1="255.5" x2="337" y2="139.25" stroke="#2f855a" stroke-width="3" marker-end="url(#cer-diagram-arrow-r)"/>
<text x="347" y="232.5" font-size="12.5" font-weight="bold" fill="#2f855a">links evidence</text>
<text x="347" y="248.5" font-size="12.5" font-weight="bold" fill="#2f855a">to claim</text>
<rect x="120" y="423" width="480" height="30" rx="15" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="360" y="443" font-size="13.5" font-weight="bold" fill="#374151" text-anchor="middle">Ask: What? / How do you know? / Why does it matter (science)?</text>
</svg>
